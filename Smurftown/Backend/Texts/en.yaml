# =========================================================== Enumerations ==========
# The keys are formed from the enum names (lowercased), not laid alongside as a switch -
# a second list would drift apart at the next value. The price: a
# rename in the enum silently changes the key, and then !rank.xyz! would stand here.

# Rank tiers. NOTE: the same words stand a second time in GameVocabulary.Tiers -
# there they are MEASURED VALUES that text recognition compares against, here it is display. The
# two can have different languages (French client, German interface),
# and whoever merges them either makes the recognition blind or the display wrong.
