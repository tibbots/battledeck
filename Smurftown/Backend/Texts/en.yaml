# The texts of the interface - ENGLISH, and thus the source.
#
# This file is not a translation, but the original: the texts stood word for word like
# this in the XAML and in the ViewModels until 22.08.2026. Every other language is its
# translation, and a key that is missing here is missing everywhere - Strings falls back to
# this file when a translation is missing a line.
#
# RULES
#
#   * Keys are flat and grouped with a dot (dialog.save). Flat, because the
#     key is then LITERALLY the same text in the code and here and can be found with a
#     single search - across four language files that's worth more than the
#     prettier nesting.
#   * NO comma in the key. It ends up in a WPF binding path of the form [key],
#     and there the comma separates multiple indexer arguments.
#   * Placeholders are numbered - {0}, {1} - so a translation can reorder them.
#     What sits behind which number is noted as a comment next to it.
#   * A text with a placeholder that a translation gets wrong does NOT crash:
#     Strings.Format catches the FormatException, falls back to English and
#     names the cause in the log.
#
# WHAT DOESN'T BELONG HERE
#
#   Log lines, the names of the diagnostic captures and the values of GameScreen. Those
#   stay English, in every language - a log is for whoever is hunting a bug,
#   and the same message must not have four different wordings.
#
#   Likewise the TEXT OF AN EXCEPTION and the READERS' NOTES (reading.Note, result.Note).
#   They are word for word the same strings that go into the log one line
#   above. Only the frame around them is translated - see problem.* further below.
#
#   And product names: "Heroes of the Storm", "Overwatch 2", "Battle.net", the
#   abbreviations HOTS/OW2/WOW/DIA and the region abbreviations EU/AM/AS.
#
# Whoever adds something here adds it in ALL four files. A missing line doesn't stand
# out when building - it falls back to English and then looks like it was intentional.
# `python tools/check-texts.py` checks all four against the code and against each other.
#
# LENGTH LIMITS
#
# Most texts sit in elements that grow with them. These five do NOT - they sit at
# a fixed width, and a translation that's too long gets cut off without anything
# being reported anywhere:
#
#   main.tabAccounts / main.tabSettings   160 px at font size 22  ->  at most 11
#       characters. Measured: "ACCOUNTS" occupies 114 px, "SETTINGS" 98.8. A German
#       "EINSTELLUNGEN" would need about 185 and doesn't fit - that's why it says "OPTIONEN" there.
#       The fixed width is deliberate: the blue underline measures the button width, not the
#       text width, and would otherwise be longer under one tab than under the other.
#
#   dialog.regionEurope / -Americas / -Asia   88 px each at font size 11
#       -> at most about 13 characters. Since 22.08.2026 they are the column heads of the
#       game/region matrix and no longer the labels of three toggles - that is why all
#       three now have the same budget, and a wider one.
#
#   settings.stopScan   130 px  ->  at most about 19 characters.
#       settings.scanAll is no longer one of them: that button became a 30x30 icon, and the
#       text moved into its tooltip - and a tooltip grows with whatever stands in it.
#
# Whoever needs a longer translation adjusts the width in the XAML along with it - and
# recalculates the row's width budget for the main tab.

