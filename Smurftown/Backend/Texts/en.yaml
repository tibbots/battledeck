progress.signingIn: Signing in {0}                       # 0 = Battletag
progress.waitMenu: Waiting for the main menu
progress.signedIn: Signed in
progress.signingOut: Signing out the running client
progress.openCollection: Opening the collection
progress.setFilter: Setting filter and sort order
progress.owned: "{0} of {1} heroes owned"                # 0 = owned, 1 = all
progress.cardsOf: "{0} of {1} cards read"                # 0 = read, 1 = expected count
