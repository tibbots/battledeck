# =========================================================== Progress ==============
# THEY DO NOT CURRENTLY REACH ANY HUMAN, and until 23.08.2026 this comment claimed the
# opposite ("never into a file"). The IProgress<string> they travel on has exactly one
# subscriber, and it writes into smurftown.log - so on a German installation the log read
# "25 von 31 Karten gelesen", against the rule that a log stays English in every language.
#
# The automation therefore renders them through Strings.ForLog, which always takes the
# English line. The translations below are KEPT rather than deleted: they are correct, a
# progress display for a flow that runs for a minute is a plausible thing to build, and
# deleting is the one irreversible move here. Whoever builds that display switches the call
# sites in GameSession, CollectionReader and LootOpener back to Strings.Current.
progress.reusing: Reusing the running client
progress.attaching: Taking over the running client
progress.starting: Starting Heroes of the Storm
progress.waitLogin: Waiting for the login form
