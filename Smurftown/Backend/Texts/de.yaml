# =========================================================== Settings =============
settings.interfaceLanguage: Sprache
settings.interfaceLanguageHint: "Die Sprache, in der Smurftown selbst spricht. Unabhängig von der Clientsprache darunter: ein französischer Client mit deutscher Oberfläche ist ein gültiger Zustand, und genau dafür gibt es zwei Einstellungen statt einer. Wirkt sofort, ohne Neustart. Das Protokoll bleibt in jeder Sprache englisch - es ist für den geschrieben, der einen Fehler sucht, und dieselbe Meldung darf nicht vier Wortlaute haben."
settings.installation: Installation
settings.pathHint: Gestartet wird der Switcher darunter - Support64\HeroesSwitcher_x64.exe, nicht der Starter im Wurzelordner. Battle.net wird nicht gebraucht; das Spiel bringt seine eigene Anmeldemaske mit.
