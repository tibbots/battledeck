settings.pathGone: Diesen Pfad gibt es nicht mehr.
settings.scanAll: Laufwerke suchen
settings.stopScan: Anhalten
settings.scanning: Suche in {0}
settings.scanNone: Auf keinem festen Laufwerk gefunden.
settings.scanOne: Eine Installation gefunden.
settings.scanMany: "{0} Installationen gefunden."
settings.scanFailed: "Suche fehlgeschlagen: {0}"
settings.notSaved: "Einstellungen nicht gespeichert: {0}"
settings.inputSpeed: Eingabetempo
settings.inputSpeedHint: "Wie schnell die App im Spiel tippt und klickt. Ein Faktor auf jede Pause und nicht fünfundzwanzig Einzelwerte - die stehen in einem Verhältnis, das jemand einmal ertastet hat. Das Warten auf das Spiel (Fenster, Anmeldemaske, Menü) hängt nicht daran: ein knapperer Wert beschleunigt dort nichts, er gibt nur früher auf."
settings.speedHint.fast: Halbe Pausen. Probiere das zuerst - verschluckt das Spiel Tastendrücke, geh zurück.
settings.speedHint.normal: Der gemessene Ausgangswert.
settings.speedHint.slow: Drei Viertel mehr. Für langsame Maschinen, oder wenn das Anmelden scheitert.
settings.clientLanguage: Sprache des Clients
settings.clientLanguageHint: "Die Sprache, in der dein Heroes-of-the-Storm-Client läuft. Die Texterkennung vergleicht das Gelesene gegen Wörter, die auf dem Schirm stehen - Rangstufen, den Beutereiter, Heldennamen - und die sind übersetzt. Das wirkt nur auf das Lesen: die Eichung ist sprachunabhängig, ein englischer Client verschiebt keinen Anker. Steht sie falsch, wird nichts erkannt - und damit auch nichts geschrieben."
settings.clientLanguageMeasured: Am laufenden Client gemessen.
settings.clientLanguageUnverified: Ungeprüft - es stand kein englischer Client zum Messen zur Verfügung. Wird nichts gelesen, gehört die Wortliste korrigiert.
settings.savedAutomatically: Einstellungen werden beim Ändern sofort gespeichert, einen Speichern-Knopf gibt es nicht. Sie liegen in .smurftown\settings.yaml neben deiner Kontenliste.

# =========================================================== Updates ==============
# Two places show this: the version chip in the top right corner of the header, and
# the ABOUT & UPDATES card at the foot of the settings tab. The chip carries both
# version numbers and opens a flyout on a click; the card carries what has no room up
# there - when GitHub was last asked, and whether this installation may replace itself.
#
# The two hint texts are the body of that flyout and differ in what the button DOES:
# installHint where the app can replace itself, pageHint where it cannot and opens the
# release page instead. The reason for the second case comes from update.reason* below
# and is put into {1} - so the human reads WHY they have to do it by hand.
update.available: "{0} verfügbar"
update.installHint: "Version {0} ist verfügbar. Klicken, um sie herunterzuladen, zu prüfen und zu installieren - Smurftown startet sich selbst neu."
update.pageHint: "Version {0} ist verfügbar. Klicken, um die Release-Seite zu öffnen - diese Installation kann sich nicht selbst ersetzen ({1})."
update.reasonDevBuild: Entwicklungsversion
update.reasonNotWritable: der Installationsordner ist schreibgeschützt
update.reasonUnknown: der Installationsordner ist unbekannt
update.preparing: Bereite vor
update.downloading: Lade {0}% herunter
update.verifying: Prüfe
update.installing: Installiere
# Both carry the text of an exception in {0}, and that stays ENGLISH - it is the same
# string that goes into the log. Only the frame around it is translated, as with problem.* above.
update.failed: "Aktualisierung fehlgeschlagen: {0}"
update.failedHint: "Die Aktualisierung ist fehlgeschlagen: {0}\nKlicken, um die Release-Seite zu öffnen."

