settings.interfaceLanguage: Langue
settings.interfaceLanguageHint: "La langue dans laquelle Smurftown s'exprime. Indépendante de la langue du client ci-dessous\xA0: un client français avec une interface allemande est un état parfaitement valide, et c'est pour cela qu'il y a deux réglages et non un seul. Prend effet immédiatement, sans redémarrage. Le journal reste en anglais dans toutes les langues - il est écrit pour celui qui cherche une erreur, et le même message ne doit pas avoir quatre formulations."
