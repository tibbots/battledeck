# The texts of the interface - SPANISH.
#
# Translation of en.yaml. That file holds the rules, the meaning of the placeholders and the
# length limits; this file holds only the words and whatever is specific to this language.
#
# ONLY ONE SPANISH VERSION, unlike the game. GameLanguage separates SpanishSpain and
# SpanishLatin, because HERO NAMES diverge there - Blaze is called "Vulcano" in Spain
# and "Blaze" in Latin America, ten names differ. A word like "Guardar" or
# "Cancelar" doesn't separate the two versions, so a second file would be the same
# file twice. Should a difference ever turn up that affects the interface, that is
# the day AppLanguage gets a fifth value - not before.
#
# NOT TRANSLATED, because they are measured values or product names: the words in
# GameVocabulary (the text that stands in the GAME), "Heroes of the Storm", "Battle.net", the
# abbreviations EU/AM/AS - and the content of every placeholder that carries an exception text.

