settings.clientLanguageHint: "El idioma en el que se ejecuta tu cliente de Heroes of the Storm. El reconocimiento de texto compara lo que lee con palabras que aparecen en pantalla - niveles de rango, la pestaña de botín, nombres de héroes - y esas están traducidas. Esto solo afecta a la lectura: la calibración es independiente del idioma, un cliente en inglés no mueve ningún ancla. Si está mal, no se reconoce nada - y por tanto tampoco se escribe nada."
