settings.inputSpeedHint: "Con qué rapidez la aplicación escribe y hace clic dentro del juego. Es un factor sobre cada pausa, no un conjunto de tiempos sueltos - estos guardan una proporción que alguien midió una vez. La espera del juego (ventana, pantalla de inicio de sesión, menú) no se ve afectada: un valor más corto no acelera nada, solo se rinde antes."
