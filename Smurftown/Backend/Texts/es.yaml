# =========================================================== Updates ==============
# Two places show this: the version chip in the top right corner of the header, and
# the ABOUT & UPDATES card at the foot of the settings tab. The chip carries both
# version numbers and opens a flyout on a click; the card carries what has no room up
# there - when GitHub was last asked, and whether this installation may replace itself.
#
# The two hint texts are the body of that flyout and differ in what the button DOES:
# installHint where the app can replace itself, pageHint where it cannot and opens the
# release page instead. The reason for the second case comes from update.reason* below
# and is put into {1} - so the human reads WHY they have to do it by hand.
update.available: "{0} disponible"
update.installHint: "La versión {0} está disponible. Haz clic para descargarla, comprobarla e instalarla - Smurftown se reinicia solo."
update.pageHint: "La versión {0} está disponible. Haz clic para abrir la página de la versión - esta instalación no puede reemplazarse a sí misma ({1})."
update.reasonDevBuild: versión de desarrollo
update.reasonNotWritable: la carpeta de instalación está protegida contra escritura
update.reasonUnknown: la carpeta de instalación es desconocida
update.preparing: Preparando
