name: build

# push-only, no pull_request trigger: having both would build every branch with an
# open PR twice. The PR inherits the run via the head commit SHA.
# branches: ['**'] includes main and excludes tags - tags go to release.yml.
on:
  push:
    branches: ['**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Same deviation as in release.yml: WPF only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Before the publish, not after: a red test should stop the run before anything
      # is built. The filter excludes tests that need OCR language packs, which a
      # GitHub runner does not have - see CLAUDE.md.
      - name: Test
        shell: bash
        run: bash ./dev test --filter "needs!=ocr"

      # publish instead of build: the same thing a release builds, just without the
      # zip. A debug build would only let a broken single-file publish surface at
      # the tag push.
      - name: Publish
        shell: bash
        run: bash ./dev publish
