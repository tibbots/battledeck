# The free hero rotation as a calendar - month and day, without a year.
#
# It repeats yearly: the same calendar day carries the same 14 heroes.
# This is measured and not assumed. Each of the 48 periods matches across
# at least TWO independent years; checked were 2023, 2024, 2025
# and 2026 on nexuscompendium.com/rotations (as of 20.08.2026).
#
# It still can't be calculated, though. The first six slots do run
# in a three-way cycle, but that breaks twice a year: on 03-08 the
# Raynor group stands for a second time in a row, and on 04-15 Tychus sits on
# Dehaka's slot. A table carries both outliers without a special case, a
# formula would have to know them as an exception.
#
# Periods begin on the 1st, 8th, 15th and 22nd of every month. Which one is currently
# running is calculated by HotsRotationPeriod - not this file. Days other than 01, 08, 15
# and 22 are never found here.
#
# The identifiers are those of the hero catalog (HotsHeroCatalog) and at the same time the
# file names of the portraits. An identifier that doesn't exist there gets
# REPORTED and skipped when loading - it doesn't silently disappear.
#
# Two oddities that are not bugs:
#   - Mei doesn't appear in a single period.
#   - Seven pairs are identically populated, for instance 01-01 and 10-08.
#
# Editable by hand. This version sits as an embedded resource in the
# application; a file at ~/.smurftown/rotation-calendar.yaml supersedes it.
# The same pattern as with screen-map.yaml and for the same reason: the
# installation folder lives under Program Files, where you don't just casually
# put something.

periods:

